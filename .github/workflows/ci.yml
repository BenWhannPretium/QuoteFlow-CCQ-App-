name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://ccq:ccq@localhost:5432/ccq
  TEST_DATABASE_URL: postgres://ccq:ccq@localhost:5432/ccq_test
  GIT_SHA: ${{ github.sha }}
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    # 45, not 30: the job now takes 25 to 30 minutes (integration tests alone take 12 to 19, Playwright 6 to 8), so
    # the 30-minute cap cancelled the Playwright step on PR 107 with every test up to then passing. It was raised
    # from 20 to 30 on FB-13 for the same reason. If the job keeps growing, split e2e into its own job instead.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccq
          POSTGRES_PASSWORD: ccq
          POSTGRES_DB: ccq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccq -d ccq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Postgres 16 service)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Migrate and seed e2e database (config seeds only, no synthetic data)
        run: pnpm db:migrate && pnpm db:seed

      - name: Install Playwright Chromium
        run: pnpm --filter @ccq/web exec playwright install --with-deps chromium

      - name: Playwright (smoke, persona shell, mobile, axe)
        run: pnpm --filter @ccq/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report
          retention-days: 7

  # FB-28 (BR-18): CI's verify job migrates an empty database, which applies the whole journal in order
  # and so cannot see a migration that an existing database would skip (the 2026-11-19 outage). This
  # job applies the PR base's migrations first (the database the test site has), then the PR's, and
  # starts the API as the App Service does. Pull requests only: on main the base is the commit itself.
  upgrade:
    name: Migration upgrade check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccq
          POSTGRES_PASSWORD: ccq
          POSTGRES_DB: ccq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccq -d ccq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch and its history: the largest journal `when` ever merged there.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The API only (and the packages it bundles): NODE_ENV=test does not serve the web app.
      - name: Build the API
        run: pnpm turbo run build --filter=@ccq/api

      - name: Upgrade check (base migrations, then this PR's, then API start-up)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm release:upgrade-check --base "origin/$BASE_REF"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (high and critical)
        run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI (not gitleaks-action) so no license key is needed once the repo moves to the Pretium org.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks git --redact --verbose --exit-code 1 .
